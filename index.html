const SRC = {"2025":"2025 A csoport","A":"régi A csoport","B":"régi B csoport","S":"összefoglaló"};

const store = {
  get(k, d){ try{ const v = localStorage.getItem("zh2_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("zh2_"+k, JSON.stringify(v)); }catch(e){} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function tagsHtml(q){
  let h = q.src.map(s => `<span class="tag">${SRC[s]}</span>`).join("");
  if(q.topic) h += `<span class="tag pts">${q.topic}</span>`;
  if(q.pts) h += `<span class="tag pts">${q.pts} pont</span>`;
  if(q.open) h += `<span class="tag open">nincs kidolgozott válasz</span>`;
  return h;
}
function answerHtml(q){
  let h = "";
  if(q.open){
    h += `<p class="note">Ehhez a kérdéshez a feltöltött anyagokban nincs kidolgozott válasz.</p>`;
    (q.rel||[]).forEach(r => h += `<p><b>Kapcsolódó az anyagból:</b> ${esc(r)}</p>`);
    return h;
  }
  q.a.forEach(p => h += `<p>${p}</p>`);
  if(q.e) h += `<p class="why${q.k==="w" ? " warn" : ""}"><b>Miért?</b> ${esc(q.e)}${KNOTE[q.k] ? ` <i>(${KNOTE[q.k]})</i>` : ""}</p>`;
  (q.img||[]).forEach((n,i) => h += `<img src="${IMG[n]}" alt="${esc(q.alt[i])}">`);
  if(q.note) h += `<p class="note">${esc(q.note)}</p>`;
  return h;
}

/* ---------- Kártyák (két külön pakli: vizsgakérdések és összefoglaló) ---------- */
const TOPICS = [...new Set(Q.filter(q => q.topic).map(q => q.topic))];
function makeDeck(p, cards, decks, filter, storeKey){
  const d = { deck:"all", queue:[], shown:false, known: new Set(store.get(storeKey, [])), total:0 };
  const pool = () => d.deck==="all" ? cards : d.deck==="unknown" ? cards.filter(q => !d.known.has(q.id)) : cards.filter(q => filter(q, d.deck));
  d.start = () => { d.queue = shuffle(pool()); d.total = d.queue.length; d.shown = false; d.render(); };
  d.render = () => {
    $(p+"-decks").innerHTML = decks.map(([k,l]) => `<button class="chip" data-k="${k}" aria-pressed="${d.deck===k}">${l}</button>`).join("");
    const kn = cards.filter(q => d.known.has(q.id)).length;
    $(p+"-known").textContent = `tudom: ${kn}/${cards.length}`;
    $(p+"-fill").style.width = (100*kn/cards.length)+"%";
    const q = d.queue[0], c = $(p+"-card");
    if(!q){
      $(p+"-count").textContent = "kész";
      c.innerHTML = `<div class="done"><strong>${d.total ? "Végigértél a paklin" : "Ebben a pakliban nincs kártya"}</strong><p class="hint">Tudom: ${kn}/${cards.length}</p><button class="btn primary" data-act="again">Újra</button></div>`;
      return;
    }
    $(p+"-count").textContent = `hátra: ${d.queue.length}`;
    c.innerHTML = `<div class="tags">${tagsHtml(q)}</div><p class="q">${esc(q.q)}</p>` +
      (d.shown
        ? `<div class="ans">${answerHtml(q)}</div><div class="row"><button class="btn bad" data-act="no">Nem tudtam<kbd>←</kbd></button><button class="btn good" data-act="yes">Tudtam<kbd>→</kbd></button></div>`
        : `<button class="btn primary" data-act="show">Válasz mutatása<kbd>Szóköz</kbd></button>`);
  };
  d.show = () => { if(!d.shown && d.queue[0]){ d.shown = true; d.render(); } };
  d.mark = ok => {
    const q = d.queue.shift(); if(!q) return;
    if(ok) d.known.add(q.id);
    else { d.known.delete(q.id); d.queue.splice(Math.min(d.queue.length, 3), 0, q); }
    store.set(storeKey, [...d.known]); d.shown = false; d.render();
  };
  $(p+"-card").onclick = e => { const a = e.target.closest("[data-act]")?.dataset.act;
    if(a==="show") d.show(); else if(a==="yes") d.mark(true); else if(a==="no") d.mark(false); else if(a==="again") d.start(); };
  $(p+"-decks").onclick = e => { const b = e.target.closest("[data-k]"); if(b){ d.deck = b.dataset.k; d.start(); } };
  $(p+"-shuffle").onclick = d.start;
  $(p+"-reset").onclick = () => { d.known.clear(); store.set(storeKey, []); d.start(); };
  return d;
}
const fc = makeDeck("fc", Q.filter(q => !q.open && !q.topic),
  [["all","Mind"],["2025","2025 A csoport"],["A","Régi A"],["B","Régi B"],["unknown","Amit még nem tudok"]],
  (q, k) => q.src.includes(k), "known");
const sc = makeDeck("sc", Q.filter(q => q.topic),
  [["all","Mind"],...TOPICS.map(t => [t,t]),["unknown","Amit még nem tudok"]],
  (q, k) => q.topic === k, "known_summary");

/* ---------- Feleletválasztós (csak az összefoglalóból) ---------- */
const MCT = [...new Set(MC.map(x => x.t))];
const mc = { mode:"all", queue:[], picked:null, right:0, tries:0, total:0, wrong: new Set(store.get("mc_wrong", [])) };
function mcPool(){
  if(mc.mode==="all") return MC;
  if(mc.mode==="wrong") return MC.filter(x => mc.wrong.has(x.id));
  return MC.filter(x => x.t === mc.mode);
}
function mcPrep(x){ const order = shuffle(x.o.map((_, i) => i)); return { ...x, order }; }
function mcStart(){ mc.queue = shuffle(mcPool()).map(mcPrep); mc.total = mc.queue.length; mc.right = 0; mc.tries = 0; mc.picked = null; mcRender(); }
function mcRender(){
  $("mc-modes").innerHTML = [["all","Mind"],...MCT.map(t => [t,t]),["wrong","Amit elrontottam ("+mc.wrong.size+")"]]
    .map(([k,l]) => `<button class="chip" data-k="${k}" aria-pressed="${mc.mode===k}">${l}</button>`).join("");
  const x = mc.queue[0], c = $("mc-card");
  $("mc-score").textContent = mc.tries ? `találat: ${mc.right}/${mc.tries}` : "";
  $("mc-fill").style.width = mc.total ? (100*(mc.total - mc.queue.length)/mc.total)+"%" : "0";
  if(!x){
    $("mc-count").textContent = "kész";
    c.innerHTML = `<div class="done"><strong>${mc.total ? mc.right+"/"+mc.tries+" találat" : "Itt most nincs kérdés"}</strong><p class="hint">${mc.total ? "A hibás válaszok a hibalistába kerültek." : "Válassz másik témát."}</p><button class="btn primary" data-act="again">Újra</button></div>`;
    return;
  }
  $("mc-count").textContent = `hátra: ${mc.queue.length}`;
  const done = mc.picked !== null;
  let h = `<div class="tags"><span class="tag">összefoglaló</span><span class="tag pts">${esc(x.t)}</span></div><p class="q">${esc(x.q)}</p><div class="opts">`;
  x.order.forEach((oi, n) => {
    const cls = !done ? "" : oi === x.c ? " right" : oi === mc.picked ? " wrong" : "";
    h += `<button class="opt${cls}" data-o="${oi}"${done ? " disabled" : ""}><span class="n">${n+1}</span><span>${esc(x.o[oi])}</span></button>`;
  });
  h += `</div>`;
  if(done){
    const ok = mc.picked === x.c;
    h += `<div class="verdict ${ok ? "ok" : "no"}"><b>${ok ? "HELYES" : "NEM JÓ"}</b><span class="why"><b>Miért?</b> ${esc(x.e)}</span></div><button class="btn primary" data-act="next">Következő<kbd>Enter</kbd></button>`;
  }
  c.innerHTML = h;
}
function mcPick(oi){
  const x = mc.queue[0]; if(!x || mc.picked !== null) return;
  mc.picked = oi; mc.tries++;
  if(oi === x.c){ mc.right++; if(mc.mode==="wrong") mc.wrong.delete(x.id); } else mc.wrong.add(x.id);
  store.set("mc_wrong", [...mc.wrong]); mcRender();
}
function mcNext(){
  const x = mc.queue.shift(); if(!x) return;
  if(mc.picked !== x.c) mc.queue.splice(Math.min(mc.queue.length, 5), 0, mcPrep(x));
  mc.picked = null; mcRender();
}
$("mc-card").onclick = e => {
  const o = e.target.closest("[data-o]"); if(o){ mcPick(+o.dataset.o); return; }
  const a = e.target.closest("[data-act]")?.dataset.act;
  if(a==="next") mcNext(); else if(a==="again") mcStart();
};
$("mc-modes").onclick = e => { const b = e.target.closest("[data-k]"); if(b){ mc.mode = b.dataset.k; mcStart(); } };
$("mc-restart").onclick = mcStart;
$("mc-reset").onclick = () => { mc.wrong.clear(); store.set("mc_wrong", []); mcStart(); };

/* ---------- Igaz–hamis ---------- */
const tf = { mode:"all", queue:[], cur:null, answered:null, right:0, tries:0, total:0, wrong: new Set(store.get("wrong", [])) };
const TFMODES = [["all","Mind"],["wrong","Amit elrontottam"],["false","Csak a hamisak javítással"]];
function tfPool(){
  if(tf.mode==="wrong") return TF.filter(x => tf.wrong.has(x.i));
  if(tf.mode==="false") return TF.filter(x => !x.t && x.fix);
  return TF;
}
function tfStart(){ tf.queue = shuffle(tfPool()); tf.total = tf.queue.length; tf.right = 0; tf.tries = 0; tf.answered = null; tfRender(); }
function tfRender(){
  $("tf-modes").innerHTML = TFMODES.map(([k,l]) => `<button class="chip" data-k="${k}" aria-pressed="${tf.mode===k}">${l}${k==="wrong" ? " ("+tf.wrong.size+")" : ""}</button>`).join("");
  const x = tf.queue[0], c = $("tf-card");
  $("tf-score").textContent = tf.tries ? `találat: ${tf.right}/${tf.tries}` : "";
  $("tf-fill").style.width = tf.total ? (100*(tf.total - tf.queue.length + (tf.answered!==null && tf.answered===x?.t ? 1 : 0))/tf.total)+"%" : "0";
  if(!x){
    $("tf-count").textContent = "kész";
    c.innerHTML = `<div class="done"><strong>${tf.total ? tf.right+"/"+tf.tries+" találat" : "Itt most nincs állítás"}</strong><p class="hint">${tf.total ? "A hibás válaszok a hibalistába kerültek." : "Válassz másik módot."}</p><button class="btn primary" id="tf-again">Újra</button></div>`;
    $("tf-again").onclick = tfStart; return;
  }
  $("tf-count").textContent = `hátra: ${tf.queue.length}`;
  let h = `<div class="tags">${x.y ? '<span class="tag y">sárgával jelölve a táblázatban</span>' : ""}</div><p class="stmt">${esc(x.s)}</p>`;
  if(tf.answered === null){
    h += `<div class="row"><button class="btn good" id="tf-t">Igaz<kbd>I</kbd></button><button class="btn bad" id="tf-f">Hamis<kbd>H</kbd></button></div>`;
  } else {
    const ok = tf.answered === x.t;
    h += `<div class="verdict ${ok ? "ok" : "no"}"><b>${ok ? "HELYES" : "NEM JÓ"} · az állítás ${x.t ? "IGAZ" : "HAMIS"}</b>${x.fix ? `<span>${x.t ? "Megjegyzés" : "Javítva"}: ${esc(x.fix)}</span>` : ""}${whyHtml(x)}</div>
          <button class="btn primary" id="tf-next">Következő<kbd>Enter</kbd></button>`;
  }
  c.innerHTML = h;
  if(tf.answered === null){ $("tf-t").onclick = () => tfAnswer(true); $("tf-f").onclick = () => tfAnswer(false); }
  else $("tf-next").onclick = tfNext;
}
function tfAnswer(v){
  const x = tf.queue[0]; if(!x || tf.answered !== null) return;
  tf.answered = v; tf.tries++;
  if(v === x.t){ tf.right++; if(tf.mode==="wrong") tf.wrong.delete(x.i); }
  else tf.wrong.add(x.i);
  store.set("wrong", [...tf.wrong]); tfRender();
}
function tfNext(){
  const x = tf.queue.shift(); if(!x) return;
  if(tf.answered !== x.t) tf.queue.splice(Math.min(tf.queue.length, 5), 0, x);
  tf.answered = null; tfRender();
}
$("tf-modes").onclick = e => { const b = e.target.closest("[data-k]"); if(b){ tf.mode = b.dataset.k; tfStart(); } };
$("tf-restart").onclick = tfStart;
$("tf-reset").onclick = () => { tf.wrong.clear(); store.set("wrong", []); tfStart(); tlRender(); };

/* ---------- Kérdésbank ---------- */
const qb = { f:"all", hide:false };
const QBF = [["all","Mind"],["2025","2025 A csoport"],["A","Régi A"],["B","Régi B"],["open","Nincs kidolgozva"]];
function qbRender(){
  $("qb-filters").innerHTML = QBF.map(([k,l]) => `<button class="chip" data-k="${k}" aria-pressed="${qb.f===k}">${l}</button>`).join("") +
    `<button class="chip" id="qb-hide" aria-pressed="${qb.hide}">Válaszok elrejtése</button>`;
  const s = norm($("qb-search").value.trim());
  const rows = Q.filter(q => !q.topic && (qb.f==="all" || (qb.f==="open" ? q.open : q.src.includes(qb.f))) &&
    (!s || norm(q.q + " " + (q.e||"") + " " + (q.topic||"") + " " + (q.a||[]).join(" ") + " " + (q.alt||[]).join(" ") + " " + (q.rel||[]).join(" ") + " " + (q.note||"")).includes(s)));
  $("qb-count").textContent = `${rows.length} kérdés`;
  $("qb-list").innerHTML = rows.map(q => `<div class="item"><div class="tags">${tagsHtml(q)}</div><h3>${esc(q.q)}</h3>` +
    (qb.hide ? `<button class="btn small" data-show="${q.id}">Válasz mutatása</button>` : `<div class="ans">${answerHtml(q)}</div>`) + `</div>`).join("");
}
$("qb-search").oninput = qbRender;
$("qb-filters").onclick = e => {
  if(e.target.id === "qb-hide"){ qb.hide = !qb.hide; qbRender(); return; }
  const b = e.target.closest("[data-k]"); if(b){ qb.f = b.dataset.k; qbRender(); }
};
$("qb-list").onclick = e => {
  const b = e.target.closest("[data-show]"); if(!b) return;
  const q = Q.find(x => x.id === b.dataset.show), d = document.createElement("div");
  d.className = "ans"; d.innerHTML = answerHtml(q); b.replaceWith(d);
};

/* ---------- Igaz–hamis lista ---------- */
const tl = { f:"all", hide:false };
const TLF = [["all","Mind"],["t","Igaz"],["f","Hamis"],["wrong","Amit elrontottam"]];
function tlRender(){
  $("tl-filters").innerHTML = TLF.map(([k,l]) => `<button class="chip" data-k="${k}" aria-pressed="${tl.f===k}">${l}</button>`).join("") +
    `<button class="chip" id="tl-hide" aria-pressed="${tl.hide}">Megoldás elrejtése</button>`;
  const s = norm($("tl-search").value.trim());
  const rows = TF.filter(x => (tl.f==="all" || (tl.f==="t" && x.t) || (tl.f==="f" && !x.t) || (tl.f==="wrong" && tf.wrong.has(x.i))) &&
    (!s || norm(x.s + " " + (x.fix||"") + " " + x.e).includes(s)));
  $("tl-count").textContent = `${rows.length} állítás${tl.hide ? " · kattints egy sorra a megoldásért" : ""}`;
  $("tl-list").innerHTML = rows.map(x => `<div class="tfrow ${x.t ? "t" : "f"}${tl.hide ? " hide" : ""}"><div class="v"><span>${x.t ? "IGAZ" : "HAMIS"}</span></div><div>${esc(x.s)}${x.y ? ' <span class="tag y">sárga</span>' : ""}${x.fix ? `<div class="fix">${esc(x.fix)}</div>` : ""}<div class="why2">${whyHtml(x)}</div></div></div>`).join("");
}
$("tl-search").oninput = tlRender;
$("tl-filters").onclick = e => {
  if(e.target.id === "tl-hide"){ tl.hide = !tl.hide; tlRender(); return; }
  const b = e.target.closest("[data-k]"); if(b){ tl.f = b.dataset.k; tlRender(); }
};
$("tl-list").onclick = e => { const r = e.target.closest(".tfrow"); if(r) r.classList.remove("hide"); };

/* ---------- Nézetek, billentyűk ---------- */
/* ---------- Összefoglaló ---------- */
(function(){
  const tmp = document.createElement("div"); tmp.innerHTML = SUM;
  const title = tmp.querySelector("p"); const top = tmp.querySelector("ul");
  const body = $("sm-body");
  if(title) body.appendChild(Object.assign(document.createElement("p"), {className:"hint", textContent: title.textContent}));
  [...top.children].forEach(li => {
    const d = document.createElement("details"); d.className = "sec"; d.open = true;
    const head = li.firstElementChild; const sm = document.createElement("summary");
    sm.innerHTML = head ? head.innerHTML : ""; d.appendChild(sm);
    if(head) head.remove();
    const c = document.createElement("div"); c.className = "secbody";
    while(li.firstChild) c.appendChild(li.firstChild);
    d.appendChild(c); body.appendChild(d);
  });
})();
function smRender(){
  const s = norm($("sm-search").value.trim());
  let n = 0;
  document.querySelectorAll("#sm-body li").forEach(li => li.classList.remove("hit","dim"));
  document.querySelectorAll("#sm-body details.sec").forEach(d => {
    if(!s){ d.hidden = false; return; }
    const lis = [...d.querySelectorAll("li")];
    const hits = lis.filter(li => norm(li.textContent).includes(s));
    const inHead = norm(d.querySelector("summary").textContent).includes(s);
    d.hidden = !hits.length && !inHead;
    if(!d.hidden){ d.open = true; n++; }
    hits.forEach(li => { if(!li.querySelector("li") || !hits.some(h => h !== li && li.contains(h))) li.classList.add("hit"); });
  });
  $("sm-count").textContent = s ? `${n} témakör egyezik` : "";
}
$("sm-search").oninput = smRender;
$("sm-open").onclick = () => document.querySelectorAll("#sm-body details").forEach(d => d.open = true);
$("sm-close").onclick = () => document.querySelectorAll("#sm-body details").forEach(d => d.open = false);

const VIEWS = ["kartyak","ossz-kartyak","feleletvalaszto","igaz-hamis","kerdesek","lista","osszefoglalo"];
let view = "kartyak";
function route(){
  const h = location.hash.replace("#","");
  view = VIEWS.includes(h) ? h : "kartyak";
  VIEWS.forEach(v => $("v-"+v).hidden = v !== view);
  document.querySelectorAll("#nav a").forEach(a => a.getAttribute("href") === "#"+view ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  if(view === "lista") tlRender();
  if(view === "igaz-hamis") tfRender();
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(view === "kartyak" || view === "ossz-kartyak"){
    const d = view === "kartyak" ? fc : sc;
    if(k === " " || k === "enter"){ e.preventDefault(); d.show(); }
    else if(d.shown && k === "arrowright") d.mark(true);
    else if(d.shown && k === "arrowleft") d.mark(false);
  } else if(view === "feleletvalaszto"){
    const x = mc.queue[0];
    if(mc.picked === null && x && /^[1-4]$/.test(k)) mcPick(x.order[+k - 1]);
    else if(mc.picked !== null && (k === "enter" || k === " ")){ e.preventDefault(); mcNext(); }
  } else if(view === "igaz-hamis"){
    if(tf.answered === null){ if(k === "i") tfAnswer(true); else if(k === "h") tfAnswer(false); }
    else if(k === "enter" || k === " "){ e.preventDefault(); tfNext(); }
  }
});
fc.start(); sc.start(); mcStart(); tfStart(); qbRender(); tlRender(); route();
</script>
