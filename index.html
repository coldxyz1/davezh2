<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SzámArch ZH2 gyakorló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout: sticky top bar with 4 views; one focused work card per view, max 760px column */
:root{
  --bg:#f2f4f1; --panel:#ffffff; --ink:#18211d; --muted:#5d6a63; --line:#d5dbd6;
  --accent:#0d6b57; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --good:#1c7a3e; --good-soft:#dff3e5; --bad:#b3311f; --bad-soft:#fbe4df; --warn-soft:#fff3bf;
  --display:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --panel:#1a211e; --ink:#e7ece9; --muted:#98a59e; --line:#2f3a35;
    --accent:#4fc3a6; --accent-ink:#0b1512; --accent-soft:#1d3630;
    --good:#6fd08c; --good-soft:#1a3324; --bad:#f08b7a; --bad-soft:#3d1f1a; --warn-soft:#4a4116;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#1a211e; --ink:#e7ece9; --muted:#98a59e; --line:#2f3a35;
  --accent:#4fc3a6; --accent-ink:#0b1512; --accent-soft:#1d3630;
  --good:#6fd08c; --good-soft:#1a3324; --bad:#f08b7a; --bad-soft:#3d1f1a; --warn-soft:#4a4116;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
img{max-width:100%;height:auto;display:block;background:#fff;border-radius:6px;border:1px solid var(--line)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
h1{font-family:var(--display);font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{font-family:var(--display);font-size:13px;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;border:1px solid transparent}
nav a:hover{color:var(--ink);border-color:var(--line)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main{max-width:760px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
section[hidden]{display:none}
section{display:flex;flex-direction:column;gap:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good-soft);border-color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px;font-weight:500}
kbd{font-family:var(--display);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);background:var(--bg)}
.meter{display:flex;gap:10px;align-items:center;font-family:var(--display);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px}
.meter .fill{height:100%;background:var(--accent);width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--display);font-size:11px}
.tag{padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--ink)}
.tag.pts{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tag.y{background:var(--warn-soft)}
.tag.open{background:var(--bad-soft)}
.q{font-size:19px;font-weight:600;line-height:1.4;margin:0;text-wrap:balance}
.ans{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ans p{margin:0}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:130px}
.stmt{font-size:21px;font-weight:600;line-height:1.4;margin:0;text-wrap:balance;min-height:3.2em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .n{font-family:var(--display);font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:20px;flex:none}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.verdict{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.verdict.ok{background:var(--good-soft);border:1px solid var(--good)}
.verdict.no{background:var(--bad-soft);border:1px solid var(--bad)}
.verdict b{font-family:var(--display);font-size:13px;letter-spacing:.04em}
.done{text-align:center;padding:30px 10px}
.done strong{font-family:var(--display);font-size:28px;display:block}
input[type=search]{flex:1;min-width:180px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.item h3{margin:0;font-size:16px;font-weight:600;line-height:1.4}
.tfrow{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;border-left-width:4px}
.tfrow.t{border-left-color:var(--good)} .tfrow.f{border-left-color:var(--bad)}
.tfrow .v{font-family:var(--display);font-size:12px;font-weight:600;padding-top:3px}
.tfrow.t .v{color:var(--good)} .tfrow.f .v{color:var(--bad)}
.tfrow .fix{font-size:14px;color:var(--muted);margin-top:2px}
.tfrow .fix::before{content:"→ "}
.tfrow.hide .v span,.tfrow.hide .fix,.tfrow.hide .why2{visibility:hidden}
.why{font-size:15px}.why i{color:var(--muted);font-size:13px}.why.warn{background:var(--warn-soft);border-radius:6px;padding:4px 8px}
.why2{margin-top:4px}.why2 .why{font-size:14px}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0}
details.sec[hidden]{display:none}
details.sec>summary{cursor:pointer;padding:14px 16px;font-weight:600;font-size:17px;list-style-position:inside}
details.sec>summary p{display:inline;margin:0}
.secbody{padding:0 16px 14px;font-size:15px}
.secbody ul{margin:4px 0;padding-left:20px}
.secbody p{margin:2px 0}
.secbody li.hit>p{background:var(--warn-soft);border-radius:4px}
#sm-body{display:flex;flex-direction:column;gap:10px}
.count{font-family:var(--display);font-size:12px;color:var(--muted)}
@media (max-width:420px){.q{font-size:17px}.stmt{font-size:18px}.card{padding:16px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>SzámArch · ZH2</h1>
  <nav id="nav">
    <a href="#kartyak">Kártyák</a>
    <a href="#ossz-kartyak">Összefoglaló kártyák</a>
    <a href="#feleletvalaszto">Feleletválasztós</a>
    <a href="#igaz-hamis">Igaz–hamis</a>
    <a href="#kerdesek">Kérdésbank</a>
    <a href="#lista">Igaz–hamis lista</a>
    <a href="#osszefoglalo">Összefoglaló</a>
  </nav>
</div></header>
<main>

<section id="v-kartyak">
  <div class="tools" id="fc-decks"></div>
  <div class="meter"><span id="fc-count"></span><div class="track"><div class="fill" id="fc-fill"></div></div><span id="fc-known"></span></div>
  <div class="card" id="fc-card"></div>
  <div class="tools"><button class="btn small" id="fc-shuffle">Újrakeverés</button><button class="btn small" id="fc-reset">Kártya-haladás törlése</button>
  <span class="hint">Szóköz: válasz · → tudtam · ← nem tudtam</span></div>
</section>

<section id="v-ossz-kartyak">
  <div class="tools" id="sc-decks"></div>
  <div class="meter"><span id="sc-count"></span><div class="track"><div class="fill" id="sc-fill"></div></div><span id="sc-known"></span></div>
  <div class="card" id="sc-card"></div>
  <div class="tools"><button class="btn small" id="sc-shuffle">Újrakeverés</button><button class="btn small" id="sc-reset">Kártya-haladás törlése</button>
  <span class="hint">Szóköz: válasz · → tudtam · ← nem tudtam</span></div>
</section>

<section id="v-feleletvalaszto" hidden>
  <div class="tools" id="mc-modes"></div>
  <div class="meter"><span id="mc-count"></span><div class="track"><div class="fill" id="mc-fill"></div></div><span id="mc-score"></span></div>
  <div class="card" id="mc-card"></div>
  <div class="tools"><button class="btn small" id="mc-restart">Újrakezdés</button><button class="btn small" id="mc-reset">Hibalista törlése</button>
  <span class="hint">1–4: válasz · Enter: következő</span></div>
</section>

<section id="v-igaz-hamis" hidden>
  <div class="tools" id="tf-modes"></div>
  <div class="meter"><span id="tf-count"></span><div class="track"><div class="fill" id="tf-fill"></div></div><span id="tf-score"></span></div>
  <div class="card" id="tf-card"></div>
  <div class="tools"><button class="btn small" id="tf-restart">Újrakezdés</button><button class="btn small" id="tf-reset">Hibalista törlése</button>
  <span class="hint">I: igaz · H: hamis · Enter: következő</span></div>
</section>

<section id="v-kerdesek" hidden>
  <div class="tools"><input type="search" id="qb-search" placeholder="Keresés a kérdésekben és válaszokban" aria-label="Keresés a kérdésbankban"></div>
  <div class="tools" id="qb-filters"></div>
  <div class="count" id="qb-count"></div>
  <div class="list" id="qb-list"></div>
</section>

<section id="v-lista" hidden>
  <div class="tools"><input type="search" id="tl-search" placeholder="Keresés az állításokban" aria-label="Keresés az állításokban"></div>
  <div class="tools" id="tl-filters"></div>
  <div class="count" id="tl-count"></div>
  <div class="list" id="tl-list"></div>
</section>

<section id="v-osszefoglalo" hidden>
  <div class="tools"><input type="search" id="sm-search" placeholder="Keresés az összefoglalóban" aria-label="Keresés az összefoglalóban"><button class="btn small" id="sm-open">Mind kinyit</button><button class="btn small" id="sm-close">Mind becsuk</button></div>
  <div class="count" id="sm-count"></div>
  <div id="sm-body"></div>
</section>

</main>
<script>
const Q = [{"id": "tinta", "q": "Ismertesse a tárgyalt tintasugaras nyomtató technológiákat, a gyártók és a technológiák megnevezésével, valamint a legfontosabb tulajdonságaikkal!", "pts": 3, "src": ["B"], "a": ["<b>HP InkJet:<\/b> Közvetlenül melegíti a tintát, amely így kilökődik a fúvókából.", "<b>Canon BubbleJet:<\/b> Egy levegőbuborékot melegít, azaz csak közvetett úton melegíti a tintát, amelyet a levegőbuborék kilök a fúvókából.", "<b>Epson Piezo:<\/b> A piezokristály feszültség hatására mechanikai alakváltozást szenved, amely így löki ki a tintacseppet. Teljesen hőmentes technológia."]}, {"id": "raid1", "q": "Írja le a RAID1 legfontosabb tulajdonságait!", "pts": 2, "src": ["2025", "B"], "a": ["Tükrözés, az adatokat két meghajtón tárolja.", "Az adatok olvasása párhuzamosan történik a diszkekről, felgyorsítván az olvasás sebességét; az írás normál sebességgel, párhuzamosan történik a meghajtókon.", "A rendszer 1 db diszk meghibásodását elviseli."]}, {"id": "hdd", "q": "Rajzolja le és magyarázza el a HDD olvasásakor fellépő, időkésleltetéseket okozó tényezőket!", "pts": 4, "src": ["A", "B"], "a": [], "img": ["image1", "image2", "image3", "image4"], "alt": ["Átlagos fejmozgatási idő", "Latency / az elfordulás miatti késleltetés", "Átviteli idő", "Disc Interleaving"]}, {"id": "bin137", "q": "Az 10001001 érték mely esetben 137, mely esetben 89 és mely esetben -119?", "pts": 2, "src": ["A"], "a": ["<b>137:<\/b> Átváltás tisztán kettes számrendszerből tízes számrendszerbe.", "<b>89:<\/b> Átváltás kettes számrendszerből tizenhatos számrendszerbe.", "<b>-119:<\/b> A kettes komplemens szerinti ábrázolás értéke tízes számrendszerben."]}, {"id": "lcd", "q": "Rajzolja le és magyarázza el az LCD kijelző egy elemi szubpixelének működését!", "pts": 4, "src": ["2025", "A", "B"], "a": ["A háttérvilágítás előtt helyezkednek el a szubpixelek. Két egymásra merőleges polárszűrő között helyezkedik el a nematikus kristály, melyre feszültséget kapcsolva (VA és TN esetében az ellentétes oldalára, IPS esetében azonos oldalra) a nematikus kristály képes a fény polarizációját elfordítani, így vezérelhető egy szubpixel működése. Az egyes szubpixelek előtt színszűrők (RGB) helyezkednek el a színes kép előállításához."], "note": "Rajz ehhez a kérdéshez nincs a feltöltött anyagokban."}, {"id": "3lcd", "q": "Írja le röviden a 3LCD technológia működését!", "pts": 3, "src": ["2025", "A"], "a": ["A technológia alapja a fény áteresztés, illetve fény át nem eresztés, LCD pixelek közreműködésével. A fény féligáteresztő tükrökön át jut el egy központi cellához, amiben egy négyzet három oldalán az egyes színszűrők és az LCD panel található. A négyzet alakú cella az átlói mentén elhelyezkedő féligáteresztő tükrök segítségével juttatja ki a fényt a cella negyedik oldalán. A színek így egy időpontban kerülnek kivetítésre."]}, {"id": "fokuszmech", "q": "Melyik technológia esetében valósul meg a dinamikus fókusz mechanikus úton, és mi ennek a mechanikus eszköznek az elnevezése?", "pts": 2, "src": ["A"], "a": ["A szkenneres lézernyomtató technológia esetén használatos a „pologinal mirror”, amit az órán „ninja csillaghoz” hasonlítottunk."]}, {"id": "optikai", "q": "Az ismertetett optikai tároló lemezek közül melyikben tesz meg a fény a legrövidebb utat, és miért?", "pts": 1, "src": ["A"], "a": ["A Blu-Ray DVD lemez esetében teszi meg a fény a legrövidebb utat, azért, hogy a fénytörés és a fényszóródás mértéke a lehető legkevesebb legyen."]}, {"id": "vertikalis", "q": "Rajzolja le a vertikális adattárolás működésének az ábráját!", "pts": 2, "src": ["A"], "a": [], "img": ["image5"], "alt": ["Vertikális adattárolás ábrája"]}, {"id": "ddr3600", "q": "Mekkora a valós órajele, az FSB sebessége és a sávszélessége a DDR4-3600 PC4-28800 memóriának?", "pts": 1, "src": ["A"], "a": ["<b>Valós órajel:<\/b> 1800 MHz", "<b>FSB:<\/b> 3600 MHz", "<b>Sávszélesség:<\/b> 28800 MB/s"]}, {"id": "lezer", "q": "Ismertesse a tárgyalt két lézeres nyomtató technológiát, a szabadalmaztatók (gyártók) és a technológiák megnevezésével!", "pts": 2, "src": ["2025", "A"], "a": ["A <b>szkenneres lézernyomtató<\/b> technológia esetén a képalkotáshoz a lézer egy forgó „poligonal mirror” (amit az órán „ninja csillaghoz” hasonlítottunk) segítségével, lencsén és tükrön át jut el a fényhengerre (OPC). Ez eredetileg a Canon technológiája, az órán HP illetve Lexmark gyártmányok kerültek bemutatásra.", "A <b>LED lézer<\/b> technológia, ami az OKI technológiája, lencsék és tükrök nélkül, közvetlenül egy teljes szélességű LED sorral világítja meg a fényhengereket."]}, {"id": "raid5", "q": "Írja le a RAID5 legfontosabb tulajdonságait!", "pts": 3, "src": ["A"], "a": ["Körbenforgó paritás.", "Mind az írási, mind az olvasási műveletek párhuzamosan végezhetők el. Egy meghajtó meghibásodása esetén az adatok nincsenek veszélyben, a hibás meghajtó adatait a rendszer a többi meghajtó adataiból vissza tudja állítani. A hibás meghajtót ajánlott azonnal cserélni, mert két meghajtó meghibásodása esetén az adatok biztosan elvesznek. A RAID 5 vezérlők a hibás diszk helyére betett új, üres diszkre automatikusan fel tudják tölteni az eredeti adatokat."], "note": "A régi A csoportos megoldás rövidebben: Körbenforgó paritás. Mind az írási, mind az olvasási műveletek párhuzamosan végezhetők el, azaz gyorsulnak. A rendszer 1 db diszk meghibásodását elviseli."}, {"id": "ddr3000", "q": "Mekkora a valós órajele, az FSB sebessége és a sávszélessége a DDR4-3000 PC4-24000 memóriának?", "pts": 1, "src": ["2025", "B"], "a": ["<b>Valós órajel:<\/b> 1500 MHz", "<b>FSB:<\/b> 3000 MHz", "<b>Sávszélesség:<\/b> 24000 MB/s"]}, {"id": "bin150", "q": "Az 10010110 értéke mely esetben 150, mely esetben 96 és mely esetben -106?", "pts": 2, "src": ["B"], "a": ["<b>150:<\/b> Átváltás tisztán kettes számrendszerből tízes számrendszerbe.", "<b>96:<\/b> Átváltás kettes számrendszerből tizenhatos számrendszerbe.", "<b>-106:<\/b> A kettes komplemens szerinti ábrázolás értéke tízes számrendszerben."], "note": "A régi B csoportos megoldásban a 96-nál ez áll: BCD-ben."}, {"id": "hamr", "q": "Rajzolja le a HAMR technológiát!", "pts": 3, "src": ["B"], "a": [], "img": ["image6"], "alt": ["HAMR Recording ábra"]}, {"id": "dlp", "q": "Írja le röviden a DLP technológia működését!", "pts": 3, "src": ["B"], "a": ["A technológia alapja a fény visszaverődésen alapul, melyet a DMD chip a felbontásnak megfelelő számú mikrotükörrel valósít meg, így képezve szürkeárnyalatos képet. A színes kép létrehozásához a rendszer egy forgó színkereket alkalmaz, amely jelenleg jellemzően minimum 7 szegmensre, színösszetevőre van bontva. Az egyes színösszetevők így nem egyszerre, hanem roppant kicsi időeltolódással vetítődnek egymásra."]}, {"id": "fokuszel", "q": "Melyik technológia esetében valósul meg a dinamikus fókusz elektronikus úton?", "pts": 1, "src": ["B"], "a": ["A CRT (Cathode Ray Tube), azaz a klasszikus képcsöves kijelzők esetében."]}, {"id": "sdlt", "q": "Miért vékonyabb a SuperDLT szalag mágneses rétege, mint a régebbi DLT szalagoké, miközben maga a szalag ugyanolyan vastag maradt?", "pts": 1, "src": ["B"], "a": ["Azért vékonyabb a mágneses réteg, mert így a többi réteg relatíve vastagabb lehet, azaz az egymásra feltekert szalag esetében a mágneses rétegek távolabb kerülnek egymástól."]}, {"id": "vezszab", "q": "Vezérlés–szabályozás különbség + ábra", "pts": null, "src": [], "a": [], "img": ["image7"], "alt": ["Vezérlés és szabályozás leírása és blokkvázlata"]}, {"id": "u-hires", "q": "Nevezzen meg három „híres embert”, akinek a neve szerepelt az eddigi tananyagban!", "pts": null, "src": ["2025"], "open": true, "rel": ["Az igaz–hamis táblázatban szereplő név: Jánosi Marcell (kazettás/MCD lemez, floppy, 70-es évek)."]}, {"id": "u-geom", "q": "Mi a jellemző különbség a mágneses és az optikai adattárolás lemezeinek adattárolási geometriájában, azaz az adatok fizikai elhelyezkedésében?", "pts": null, "src": ["2025"], "open": true, "rel": ["Igaz–hamis táblázat: „A DVD-RAM adatgeometriája egy ZBR HDD-hoz hasonlít” – IGAZ."]}, {"id": "u-fgt", "q": "Mi a neve annak a két módszernek, amivel töltést tudunk bejuttatni az FGT vagy CTF egy elemi cellájába?", "pts": null, "src": ["2025"], "open": true, "rel": ["Az összefoglalóból: FGT = az első generáció, szilícium-dioxid szigetelőréteggel; CTF = kisebb méretű, szilícium-nitrid alapú szigetelés. A töltés bejuttatásának két módszere nincs leírva."]}, {"id": "u-ddp", "q": "Mi a Dynamic Disc Pool legnagyobb előnye a RAID-del szemben?", "pts": null, "src": ["2025", "S"], "a": ["Hagyományos RAID 6 és más paritásos RAID-eknél nagy kapacitású lemezek (2–3 TB) meghibásodásakor a helyreállítás sok idő. A DDP ezt az időt drasztikusan lerövidíti.", "Használatához (az elméleti 7-tel szemben) minimum 11 db HDD vagy SSD szükséges."]}, {"id": "u-ips", "q": "Miben tér el az IPS technológia a másik két ismertetett technológiától? Írja le az IPS és a másik két ismertetett technológia nevét is!", "pts": null, "src": ["2025", "S"], "a": ["<b>IPS<\/b> (In-Plane Switching): a feszültséget a cella egyik (azonos) oldalára kapcsolják. Párhuzamos polárszűrők, 2 FET.", "<b>VA<\/b> (Vertical Alignment, külön-külön forduló kristályok) és <b>TN<\/b> (Twisted Nematic, 1 FET és 2 ÉS kapu, csavart kristályszerkezet): a feszültséget a cella ellentétes oldalaira (két oldalról) kapcsolják.", "A legfontosabb különbség a feszültség rákapcsolásának irányában és a kristályok viselkedésében van."]}, {"id": "u-carbon", "q": "Mi a Carbon3D két legfontosabb előnye a többi 3D technológiához képest?", "pts": null, "src": ["2025"], "open": true, "rel": ["Az összefoglalóban a Carbon3D csak felsorolásként szerepel a 3D nyomtatók között (Objet, Isis One, Carbon3D; FDM, SLA, SLS eljárások) – előnyei nincsenek leírva."]}, {"id": "u-ddr", "q": "Mit jelent a RAM-ok esetében a DDR elnevezés? Mi ennek a technológiának az előnye?", "pts": null, "src": ["2025", "S"], "a": ["<b>DDR<\/b> = Double Data Rate.", "Előnye: órajelciklusonként kétszeri adatátvitelt tesz lehetővé, a felfutó és a lefutó él mentén egyaránt (az SDR csak egyszerit)."]}, {"id": "s1", "q": "Min alapul az LCD működése?", "a": ["A fény polarizációján."], "e": "Két egymásra merőleges polárszűrő között nematikus kristályréteg van, ami feszültség hatására elfordítja a fény polarizációs síkját – ettől jut át vagy nem a fény.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s2", "q": "Igényel-e háttérvilágítást az LCD?", "a": ["Igen."], "e": "A folyadékkristály maga nem világít: a fényt a panel hátuljából kapja, a pixelek csak szűrik azt.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s3", "q": "Mi állítja elő az LCD-n a színeket?", "a": ["A szubpixelek előtt lévő RGB színszűrők."], "e": "A pixelek csak a háttérvilágítás fehér fényét szűrik; a színt a szűrő adja.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s4", "q": "Mi az IPS rövidítés feloldása és felépítése?", "a": ["In-Plane Switching – párhuzamos polárszűrők, 2 FET."], "e": "Az „in-plane” arra utal, hogy a feszültséget a cella egyik (azonos) oldalára kapcsolják, a kristály a panel síkjában fordul.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s5", "q": "Mi a VA rövidítés feloldása és felépítése?", "a": ["Vertical Alignment – külön-külön forduló kristályok."], "e": "VA-nál a feszültséget a cella ellentétes oldalaira (két oldalról) kapcsolják, mint a TN-nél.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s6", "q": "Mi a TN rövidítés feloldása és felépítése?", "a": ["Twisted Nematic – 1 FET és 2 ÉS kapu, csavart kristályszerkezet."], "e": "A „twisted” a csavart kristályszerkezetre utal; a feszültség itt is a cella két oldaláról jön.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s7", "q": "Hová kapcsolják a feszültséget IPS, illetve VA/TN esetén?", "a": ["IPS: a cella egyik (azonos) oldalára. VA és TN: az ellentétes oldalaira."], "e": "Az összefoglaló szerint ez a legfontosabb különbség: a feszültség rákapcsolásának iránya és a kristályok viselkedése.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s8", "q": "Milyen vezérlése lehet az LCD-nek?", "a": ["TFT (aktív mátrix) vagy DSTN (passzív mátrix)."], "e": "A TFT-nél minden pixelt saját tranzisztor vezérel (ezért aktív), a DSTN-nél nincs pixelenkénti tranzisztor.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s9", "q": "Milyen gázt használ a plazma kijelző?", "a": ["Neont és xenont."], "e": "Minden szubpixel egy kis gázcella, ami felvillan.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s10", "q": "Igényel-e háttérvilágítást a plazma?", "a": ["Nem."], "e": "A pixelek (gázcellák) maguk világítanak.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s11", "q": "Miben jobb és miben rosszabb a plazma az LCD-nél?", "a": ["Kontrasztosabb, jobb a színhűsége, de nagyobb az áramfogyasztása."], "e": "A cellák maguk világítanak, nem háttérvilágítást szűrnek; cserébe minden cella energiát fogyaszt.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s12", "q": "Mi bocsátja ki a fényt az OLED-ben?", "a": ["Szerves (organikus) molekulák."], "e": "Innen a név: Organic Light-Emitting Diode.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s13", "q": "Miért lehet az OLED vékony, akár hajlékony?", "a": ["Mert nem igényel háttérvilágítást."], "e": "A pixelek maguk világítanak, nincs szükség hátsó fényforrás-rétegre.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s14", "q": "Mi az OLED hátránya?", "a": ["A szerves anyag idővel kifárad (öregszik)."], "e": "Ezért veszít a színhűségéből (sárgulhat a kép) és a fényerejéből.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s15", "q": "Miből állnak a Micro LED szubpixelei?", "a": ["Mikroszkopikus méretű, önálló LED-ekből."], "e": "Minden szubpixel saját LED, ami maga világít.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s16", "q": "Mi a Micro LED előnye az OLED-del szemben?", "a": ["Nem öregszik el olyan hamar."], "e": "Nincs benne szerves anyag, ami kifáradna. (Sony és Samsung technológia)", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s17", "q": "Hány elektronágyú van a CRT-ben, és mit bombáznak?", "a": ["3 (R, G, B); a képernyő belső felületén lévő foszforréteget."], "e": "Minden alapszínhez külön ágyú tartozik.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s18", "q": "Hogyan rajzolja ki a képet a CRT?", "a": ["Pásztázással (raster scan): interlaced (váltott soros) vagy non-interlaced / progresszív."], "e": "A progresszív (nem váltott soros) adja a szebb képet, mert minden sort minden képben kirajzol.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s19", "q": "Miért passzív megjelenítő a CRT, és miért fárasztja a szemet?", "a": ["A foszfor csak akkor villan fel, ha eltalálja a sugár."], "e": "A pont a sugár elhaladása után elhalványul, ezért a kép vibrál – ez fárasztja a szemet.", "k": "m", "topic": "Kijelzők", "src": ["S"], "pts": null}, {"id": "s20", "q": "Mit jelent a RAID?", "a": ["Redundant Array of Inexpensive (vagy Independent) Disks."], "e": "A lemezeket logikai egységekbe szervezi; célja az adatbiztonság és/vagy a sebesség növelése.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s21", "q": "Mi a RAID 0 működési elve?", "a": ["Összefűzés: a lemezeket egyetlen logikai lemezzé fűzi."], "e": "Nincs benne másolat vagy paritás – csak összeadja a lemezeket.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s22", "q": "Mi gyorsul RAID 0-nál?", "a": ["Az írás és az olvasás is."], "e": "Mindkét művelet párhuzamosan történik a lemezeken.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s23", "q": "Mennyi hibát tűr a RAID 0?", "a": ["Egyet sem."], "e": "Nincs redundancia: egy meghajtó hibája az egész tömb (minden adat) elvesztését okozza.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s24", "q": "Mekkora lemezek használhatók RAID 0-ban?", "a": ["Különböző méretűek is, de mind csak a legkisebb méretéig."], "e": "A nagyobb lemezek többlete kihasználatlan marad.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s25", "q": "Mi a RAID 1 működési elve?", "a": ["Tükrözés: az adatot egyidejűleg a tömb minden elemén tárolja."], "e": "Minden lemezen ugyanaz az adat van.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s26", "q": "Mi gyorsul RAID 1-nél?", "a": ["Csak az olvasás."], "e": "Olvasni párhuzamosan lehet a lemezekről, de írni mindegyikre ugyanazt kell, ezért az írás normál sebességű.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s27", "q": "Mennyi hibát tűr a RAID 1, és mekkora a kapacitása?", "a": ["1 lemez hibáját; a kapacitás a legkisebb elem mérete."], "e": "A másik lemezen megvan ugyanaz az adat; mivel tükör, a hasznos méret nem nő.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s28", "q": "Melyik gyorsabb adatelérésű: RAID 1 vagy RAID 5?", "a": ["RAID 1."], "e": "Az összefoglaló ezt tényként rögzíti. (Saját kiegészítés: RAID 1-nél nincs paritásszámítás.)", "k": "o", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s29", "q": "Mi a RAID 5 működési elve?", "a": ["Körbeforgó paritás."], "e": "A paritást nem dedikált meghajtón, hanem egyenletesen az összes meghajtón elosztva tárolja.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s30", "q": "Hány lemez hibáját tűri a RAID 5, és hány lemez kell hozzá?", "a": ["Maximum 1-et; minimum 3 lemez kell."], "e": "Egy paritásból egy hiányzó lemez állítható vissza; kettőnél az adatok elvesznek.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s31", "q": "Mekkora a RAID 5 hasznos kapacitása?", "a": ["(meghajtók száma − 1) × legkisebb meghajtó mérete."], "e": "Egy lemeznyi hely (elosztva) a paritásé.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s32", "q": "Mi a RAID 6 működési elve?", "a": ["Dupla paritás: soronként és oszloponként is számol paritást."], "e": "A RAID 5 kiterjesztése; a paritás kétszer annyi helyet foglal.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s33", "q": "Hány lemez hibáját tűri a RAID 6, és hány lemez kell?", "a": ["2-t; minimum 4 lemez."], "e": "Két független paritásból két kiesett lemez állítható vissza.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s34", "q": "Hogyan épül fel a RAID 01?", "a": ["Összefűzött (RAID 0) tömböket tükröz (RAID 1)."], "e": "Előbb összefűz, utána tükröz – a számok sorrendje mutatja.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s35", "q": "Mi a RAID 01 hátránya?", "a": ["Egy lemez hibájakor a RAID 0 szétesik, így a tükrözés is megszakad."], "e": "A RAID 0-nak nincs hibatűrése, és a tükör egyik fele így egészben kiesik.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s36", "q": "Hogyan épül fel a RAID 10?", "a": ["Először tükröz (RAID 1), majd a tömböket fűzi össze (RAID 0)."], "e": "Előbb tükröz, utána összefűz.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s37", "q": "Melyik biztonságosabb: RAID 01 vagy RAID 10? Melyik gyorsabb?", "a": ["A RAID 10 biztonságosabb; sebességben nincs különbség."], "e": "RAID 10-nél egy diszk kiesése csak a saját tükörpárját érinti, a ráépülő RAID 0-t nem.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s38", "q": "RAID 01 / 10: hány lemez kell, és mekkora a kapacitás?", "a": ["Minimum 4; a kapacitás a felére csökken."], "e": "A tükrözés miatt minden adat kétszer van tárolva.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s39", "q": "Gyorsabb vagy lassabb a RAID 01 a sima RAID 0-nál?", "a": ["Lassabb."], "e": "Az összefoglaló szerint sebességnövelő, de lassabb a sima RAID 0-nál.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s40", "q": "Mi a RAID 50 és a RAID 60?", "a": ["RAID 50: RAID 5 tömbök összefűzése. RAID 60: RAID 6 tömbök összefűzése."], "e": "A szám első jegye az alsó szint (5 vagy 6), a 0 az összefűzés.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s41", "q": "Hány lemez kiesését tűri a RAID 50 és a RAID 60?", "a": ["RAID 50: több mint 1-et, RAID 60: több mint 2-t."], "e": "Csak akkor, ha a hibás lemezek nem ugyanabban az alsóbb szintű tömbben vannak – tömbönként 1, illetve 2.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s42", "q": "Milyen problémát old meg a Dynamic Disk Pool (DDP)?", "a": ["A nagy lemezek (2–3 TB) hibája utáni hosszú helyreállítási időt."], "e": "Paritásos RAID-eknél (pl. RAID 6) a helyreállítás sok idő; a DDP ezt drasztikusan lerövidíti.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s43", "q": "Hány lemez kell a DDP-hez?", "a": ["Minimum 11 HDD vagy SSD (az elméleti 7-tel szemben)."], "e": "Az összefoglaló számadata.", "k": "m", "topic": "RAID", "src": ["S"], "pts": null}, {"id": "s44", "q": "DDR4-3000 PC4-24000: valós órajel, FSB, sávszélesség?", "a": ["1500 MHz; 3000 MHz; 24000 MB/s."], "e": "A DDR órajelenként kétszer visz át adatot, ezért a valós órajel a jelölés (3000) fele. A PC4-szám a sávszélesség MB/s-ban.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s45", "q": "Mit jelent a „random” a RAM nevében?", "a": ["Tetszőleges hozzáférést."], "e": "A szekvenciális (sorrendi) hozzáférés ellentéte: bármelyik cím közvetlenül elérhető.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s46", "q": "Mit jelent, hogy a RAM volatilis?", "a": ["Kikapcsoláskor a tartalma elvész."], "e": "Múlékony tároló: csak tápfeszültség mellett őrzi az adatot.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s47", "q": "Miből áll egy SRAM cella?", "a": ["2 egymással szembe kötött inverterből és 2 MOSFET-ből."], "e": "A két inverter egymást tartja stabil állapotban – ez tárolja a bitet.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s48", "q": "Igényel-e frissítést az SRAM?", "a": ["Nem."], "e": "Amíg tápfeszültséget kap, megőrzi a bitet.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s49", "q": "SRAM vagy DRAM: melyik gyorsabb, melyik drágább? Mire használják az SRAM-ot?", "a": ["Az SRAM gyorsabb és drágább; processzor-gyorsítótárnak."], "e": "A gyártási technológia miatt drágább, ezért csak kis, gyors tárnak éri meg.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s50", "q": "Miből áll egy DRAM cella, és mi tárolja a bitet?", "a": ["1 kondenzátorból és 1 tranzisztorból (MOSFET); a kondenzátor töltöttsége."], "e": "Töltött vagy nem töltött kondenzátor = 1 vagy 0.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s51", "q": "Miért kell a DRAM-ot frissíteni, és milyen gyakran?", "a": ["A kondenzátor csak rövid ideig őrzi a töltést; kb. másodpercenként egyszer."], "e": "A töltés elszivárogna, ezért ciklikusan vissza kell írni.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s52", "q": "Mi történik egy DRAM cella írásakor?", "a": ["A teljes sor kiolvasásra kerül, egy érték megváltozik, majd az egész sor visszaíródik."], "e": "A DRAM soronként kezeli a cellákat.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s53", "q": "Mi az SDR?", "a": ["Single Data Rate: órajelciklusonként egyszeri adatátvitel."], "e": "Csak az órajel egyik élén visz át adatot.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s54", "q": "Mi a DDR, és mi az előnye?", "a": ["Double Data Rate: órajelciklusonként kétszeri adatátvitel."], "e": "A felfutó és a lefutó él mentén is visz adatot, így azonos órajelen kétszer annyit, mint az SDR.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s55", "q": "Mi az ECC memória, és hol használják?", "a": ["Error-Correcting Code; professzionális szerverekben."], "e": "Paritásgenerálással képes a hibajavításra.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s56", "q": "Mi a ROM, és mire használják?", "a": ["Read Only Memory: nem volatilis tároló; nem változó programokhoz (BIOS, BOOT)."], "e": "Kikapcsoláskor sem vesznek el az adatai.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s57", "q": "Mi a PROM, EPROM és EEPROM?", "a": ["PROM: programozható ROM. EPROM: törölhető és programozható. EEPROM: elektromosan törölhető és programozható."], "e": "Mindegyik egy-egy lépéssel több módosíthatóságot ad a ROM-hoz.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s58", "q": "Mi a Flash memória a ROM-okhoz képest?", "a": ["Az EEPROM továbbfejlesztett változata: blokkonként is törölhető és újraírható."], "e": "Az EEPROM csak teljes egészében törölhető, a Flash blokkonként is.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s59", "q": "Milyen gyors a Flash a HDD-hez és a DRAM-hoz képest?", "a": ["Gyorsabb a HDD-nél, lassabb a DRAM-nál."], "e": "Nincsenek mozgó alkatrészei (mint a HDD-nek), de nem éri el a DRAM sebességét.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s60", "q": "Megőrzi-e a Flash az adatot áram nélkül?", "a": ["Igen."], "e": "Nem volatilis, mint a ROM-ok.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s61", "q": "NOR: hozzáférés, címzés, gyártó?", "a": ["Párhuzamos hozzáférés, közvetlen bájtonkénti (random) címzés; pl. Intel."], "e": "A bájtonkénti elérés miatt közvetlen programfuttatásra alkalmas.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s62", "q": "NOR jellemzői (kapacitás, sebesség, ár)?", "a": ["Kisebb kapacitás, gyors olvasás, viszonylag drága."], "e": "Az összefoglaló szerint.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s63", "q": "NAND: hozzáférés, címzés, gyártó?", "a": ["Soros hozzáférés, csak laponként címezhető; pl. Samsung."], "e": "Mivel csak laponként érhető el, közvetlen programfuttatásra nem alkalmas.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s64", "q": "Mire való a NAND, és miben jobb a NOR-nál?", "a": ["Nagy adatmennyiség folytonos írására-olvasására; kisebb, energiatakarékosabb, nagyobb kapacitású és olcsóbb."], "e": "Ezért ez kerül a nagy tárolókba.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "sf1", "q": "Hány bitet tárol cellánként az SLC, MLC és TLC?", "a": ["SLC: 1, MLC: 2, TLC: 3 bit/cella."], "e": "A név is mutatja: Single, Multi (2), Triple Level Cell.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "sf2", "q": "Melyik cellatípus a legdrágább, és melyik bírja a legtöbb írást?", "a": ["Az SLC – mindkettő."], "e": "Cellánként csak 1 bitet tárol, és ennek a leghosszabb az élettartama.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "sf3", "q": "Mi jellemzi az MLC-t az SLC-hez és a TLC-hez képest?", "a": ["Arany középút (2 bit/cella)."], "e": "Árban, kapacitásban és élettartamban az SLC és a TLC között van.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "sf4", "q": "Mi jellemzi a TLC-t, és hol használják?", "a": ["A legolcsóbb, legnagyobb kapacitású, de a leggyorsabban kifáradó; otthoni SSD-kben."], "e": "Cellánként 3 bitet tárol: több adat egy cellában, de rövidebb élettartam.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "sf5", "q": "Mi az FGT cellatechnológia?", "a": ["Az első generáció, szilícium-dioxid szigetelőréteggel."], "e": "A CTF ehhez képest kisebb méretű, más (szilícium-nitrid) szigeteléssel.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "sf6", "q": "Mi a CTF cellatechnológia?", "a": ["Kisebb méretű cella, szilícium-nitrid alapú szigeteléssel."], "e": "Az FGT szilícium-dioxidja helyett szilícium-nitridet használ.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "sf7", "q": "Mi a 3D V-NAND, és mi tette lehetővé?", "a": ["A cellákat egymás fölé rétegezik; a CTF kis mérete tette lehetővé."], "e": "A kis cellaméret miatt a cellák nem csak egymás mellé, hanem egymás fölé is rakhatók.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "sf8", "q": "Mi kopik a NAND cellában az írások során?", "a": ["A cella szigetelőrétege."], "e": "Ezért fárad ki a cella egy idő után.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "sf9", "q": "Mi a Wear Leveling?", "a": ["A vezérlő a háttérben folyamatosan pakolássza az adatokat, hogy a cellák egyenletesen kopjanak."], "e": "Így nem fárad ki idő előtt néhány gyakran írt cella.", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "sf10", "q": "Mennyit érdemes az SSD kapacitásából üresen hagyni, és miért?", "a": ["Kb. 10%-ot."], "e": "Hogy a vezérlőnek legyen mozgástere a kiegyensúlyozáshoz (Wear Leveling).", "k": "m", "topic": "Memória", "src": ["S"], "pts": null}, {"id": "s65", "q": "Min alapul a 3LCD?", "a": ["A fény áteresztés – fény át nem eresztés elvén."], "e": "Az LCD pixelek átengedik vagy elzárják a fényt.", "k": "m", "topic": "Projektorok", "src": ["S"], "pts": null}, {"id": "s66", "q": "Mik a dikroikus szűrők a 3LCD projektorban?", "a": ["Félig áteresztő tükrök: üveglapra felvitt, különböző törésmutatójú dielektromos rétegek sorozata."], "e": "Precíziós optikai elemek, amelyek hullámhossz szerint válogatják a fényt.", "k": "m", "topic": "Projektorok", "src": ["S"], "pts": null}, {"id": "s67", "q": "Miért nem melegszenek túl a dikroikus szűrők?", "a": ["Nem nyelik el a nem kívánt fényt, hanem visszaverik."], "e": "A hullámhosszak egy részét átengedik, a többit szelektíven irányítják – a hagyományos színszűrő elnyelné és melegedne.", "k": "m", "topic": "Projektorok", "src": ["S"], "pts": null}, {"id": "s68", "q": "Miért kell a 3LCD-hez erős fényforrás?", "a": ["Az LCD polarizációja miatt a fényerő egy része elvész."], "e": "A polárszűrő kiszűri a fény egy részét.", "k": "m", "topic": "Projektorok", "src": ["S"], "pts": null}, {"id": "s69", "q": "Miért jobb a DLP fényhasznosítása az LCD-nél?", "a": ["A teljes fénymennyiséget mikrotükrök verik vissza."], "e": "Nincs polarizáció, így nincs az LCD-kre jellemző fényerőveszteség.", "k": "m", "topic": "Projektorok", "src": ["S"], "pts": null}, {"id": "s70", "q": "Milyen fényforrást használ a LED projektor, és hová irányítja a fényt?", "a": ["Külön kék, piros és zöld LED-et; a DLP chipre."], "e": "A fényt lencsék és prizmák irányítják a DLP chipre (és a tükörre).", "k": "m", "topic": "Projektorok", "src": ["S"], "pts": null}, {"id": "s71", "q": "Milyen fényforrásai vannak a Laser + DLP hibrid projektornak?", "a": ["Egy kék lézer és egy piros LED, kondenzor lencsékkel."], "e": "Vegyesen használja a lézert és a LED-et.", "k": "m", "topic": "Projektorok", "src": ["S"], "pts": null}, {"id": "s72", "q": "Mivel állítja elő a zöld színt a Laser + DLP hibrid?", "a": ["Kék lézerrel."], "e": "Az összefoglaló tényként rögzíti (és az igaz–hamis táblázatban is IGAZ).", "k": "m", "topic": "Projektorok", "src": ["S"], "pts": null}, {"id": "s73", "q": "Miben mérjük a nyomtató és a képernyő felbontását?", "a": ["Nyomtató: dpi. Képernyő: ppi."], "e": "dpi = dots per inch (pont), ppi = pixels per inch (pixel).", "k": "o", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s74", "q": "Hány tűs általában a mátrix nyomtató, és melyik gyártóé volt az órán?", "a": ["24 tűs; Citizen."], "e": "Az óravázlat Citizen megoldását mutatta be.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s75", "q": "Mi a mátrix nyomtató legelőnyösebb tulajdonsága?", "a": ["Több példány egyidejű nyomtatása."], "e": "A tűk ütése indigón vagy önátíró papíron át több lapra is átmegy. (A mechanizmus saját kiegészítés.)", "k": "o", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s76", "q": "Használ-e hevítést a tintasugaras (InkJet) nyomtató?", "a": ["Igen."], "e": "Forró tintacseppeket lövell; az ezt tagadó állítás hamis. (A hőmentes a Piezo.)", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s77", "q": "Hogyan működik a Bubble Jet, és kié?", "a": ["A Canoné; buborékkal lövelli ki a tintát, a tintát közvetetten melegíti."], "e": "A buborékot melegíti, nem közvetlenül a tintát.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s78", "q": "Hogyan működik a Piezo, és kié?", "a": ["Az Epsoné; piezoelektromos kristályok alakváltozásával."], "e": "Hőmentes technológia: a kristály feszültség hatására alakot vált és kilöki a cseppet.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s79", "q": "Kié az Ink Jet technológia?", "a": ["A HP-é."], "e": "A tintát közvetlenül melegíti.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s80", "q": "Hogyan jut a fény a hengerre a szkenneres lézernyomtatónál, és kiké?", "a": ["Forgó tükrön át, közvetetten; Lexmark, HP (eredetileg Canon)."], "e": "A forgó (poligon) tükör vetíti a lézert a hengerre.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s81", "q": "Mi a LED lézer lényege, és kié?", "a": ["Teljes szélességű LED sor helyettesíti a lézert; az OKI-é."], "e": "Nincs forgó tükör és lencse, a LED sor közvetlenül világít.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s82", "q": "Miért nő jelentősen a LED lézer mérete nagyobb lapmérettel?", "a": ["Mert a LED sornak a teljes lapszélességet le kell fednie."], "e": "Nagyobb lap = hosszabb LED sor = nagyobb készülék.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s83", "q": "Lézernyomtatás: mi az első két lépés?", "a": ["1. A henger elektromos töltést kap. 2. A lézer megvilágítja a fényérzékeny hengert."], "e": "A henger ott marad töltött, ahol a nyomtatandó pontok lesznek.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s84", "q": "Lézernyomtatás: hogyan kerül a festék a hengerre, majd a papírra?", "a": ["A festékszemcsék a henger töltött részeire ragadnak; egy töltő vezeték feltölti a papírt, és a festék átkerül rá."], "e": "Az elektromos töltés vonzza a festéket a hengerre, majd a papírra.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s85", "q": "Lézernyomtatás: mi rögzíti a festéket, és mi a corona wire szerepe?", "a": ["A fűtőrendszer hővel és nyomással ráégeti; a corona wire elvezeti a töltést a hengerről."], "e": "Így a henger felkészül a következő oldalra.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s86", "q": "Mi a ZINK?", "a": ["Zero Ink: nem kell hozzá festék."], "e": "A színeket egy speciális papírból hő hatására hívja elő.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s87", "q": "Milyen 3D nyomtató megoldások és eljárások szerepeltek?", "a": ["Objet, Isis One, Carbon3D; FDM, SLA, SLS."], "e": "Az összefoglaló felsorolása.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s88", "q": "Milyen egyéb nyomtatási technológiák vannak, és melyek elavultak?", "a": ["Termotranszfer (Canon hőátadásos), termálviaszos, festékszublimációs; elavult: írógép, margarétafejes."], "e": "Az összefoglaló felsorolása.", "k": "m", "topic": "Nyomtatók", "src": ["S"], "pts": null}, {"id": "s89", "q": "Milyen szkenner kategóriák vannak?", "a": ["Síkágyas, lapolvasó, kézi olvasó, vonalkód- és QR-kód olvasó (pl. UPC-A)."], "e": "Az összefoglaló felsorolása.", "k": "m", "topic": "Szkennerek", "src": ["S"], "pts": null}, {"id": "s90", "q": "Mire használják a vonalkódolvasót?", "a": ["Ahol gyors, pontos és ismétlődő inputra van szükség."], "e": "Optikailag vonalakat olvas le.", "k": "m", "topic": "Szkennerek", "src": ["S"], "pts": null}, {"id": "s91", "q": "Hogyan jut a kép a szkennerben a számítógépbe?", "a": ["Fényforrás → lapról visszaverődik → tükrök és lencsék → RGB-bevonatú CCD chip → A/D konverter."], "e": "A CCD (Charge-Coupled Device) érzékeli a fényt, az A/D konverter digitalizálja.", "k": "m", "topic": "Szkennerek", "src": ["S"], "pts": null}, {"id": "s92", "q": "Mi az OCR, és mi a korlátja?", "a": ["Optikai karakterfelismerő: nyomtatott szöveget szöveges adattá alakít; magas hibaarány."], "e": "A viszonylag magas hibaarány miatt általános használata korlátozott.", "k": "m", "topic": "Szkennerek", "src": ["S"], "pts": null}, {"id": "s93", "q": "Mi az LMC, és mit mutat be?", "a": ["Little Man Computer: elméleti gép a CPU és a memória működésének megértésére; a Neumann-architektúrát."], "e": "A „kis ember” munkaállomásán keresztül szemlélteti a gép részeit.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}, {"id": "s94", "q": "Hány postafiók van az LMC-ben, és mi van bennük?", "a": ["100 (0–99); adatok ÉS program utasítások."], "e": "Neumann-elv: az adat és a program ugyanabban a memóriában van.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}, {"id": "s95", "q": "Mi a számológép (akkumulátor) szerepe az LMC-ben?", "a": ["Itt történnek a műveletek; minden adat a memóriából először ide kerül."], "e": "Ezért a memóriából közvetlenül nem mehet adat a kimeneti kosárba.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}, {"id": "s96", "q": "Mit mutat a programszámláló (PC)?", "a": ["A következő végrehajtandó utasítás címét (fiókszámát)."], "e": "Utasításonként lép tovább, ugrásnál átíródik.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}, {"id": "s97", "q": "Mi az utasításregiszter?", "a": ["Ide kerül a fiókból az éppen aktuális utasítás."], "e": "Ezt hajtja végre a kis ember.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}, {"id": "s98", "q": "Hány számjegyből áll egy LMC gépi kódú utasítás, és mit jelentenek?", "a": ["3: az első a műveleti kód (opcode), a másik kettő a memóriacím (operandus)."], "e": "Pl. 5xx: az első jegy (5) = LDA, xx = a fiók címe.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}, {"id": "s99", "q": "Mit csinál az INP és az OUT, mi a kódjuk?", "a": ["INP (901): bemeneti kosár → akkumulátor. OUT (902): akkumulátor → kimeneti kosár."], "e": "Mindkettő az akkumulátoron keresztül megy.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}, {"id": "s100", "q": "Mit csinál az LDA és az STA, mi a kódjuk?", "a": ["LDA (5xx): xx fiók → akkumulátor. STA (3xx): akkumulátor → xx fiók."], "e": "Load = betölt, Store = kiment.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}, {"id": "s101", "q": "Mi az ADD és a SUB kódja?", "a": ["ADD: 1xx, SUB: 2xx."], "e": "Az xx fiók tartalmát adja hozzá / vonja ki az akkumulátorból.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}, {"id": "s102", "q": "Mit csinál a BRA, BRZ, BRP, mi a kódjuk?", "a": ["BRA (6xx): feltétel nélküli ugrás. BRZ (7xx): ugrik, ha az akku 0. BRP (8xx): ugrik, ha az akku pozitív."], "e": "Az ugrás a programszámlálót állítja át az xx címre.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}, {"id": "s103", "q": "Mi a HLT és a DAT?", "a": ["HLT (000): program vége. DAT: adattárolás – nem végrehajtható, csak lefoglal egy fiókot egy változónak."], "e": "A DAT nem utasítás, hanem helyfoglalás.", "k": "m", "topic": "LMC", "src": ["S"], "pts": null}];

const SUM = "<p><em><strong><u>Számítógép Architektúrák – ZH2 Összefoglalás:<\/u><\/strong><\/em><\/p>\n<ul>\n<li><p><strong>Kijelzők:<\/strong><\/p>\n<ul>\n<li><p><strong>LCD (Folyadékristályos kijelző)<\/strong><\/p>\n<ul>\n<li><p><strong>Alapelv:<\/strong> A fény polarizációján alapul. Két egymásra merőleges polárszűrő között egy nematikus kristályréteg (folyadékkristály) helyezkedik el, ami feszültség hatására elfordítja a fény polarizációs síkját.<\/p><\/li>\n<li><p><strong>Háttérvilágítás:<\/strong> Igényli (aktív megjelenítő). A fényt a panel hátuljából kapja, a pixelek csak szűrik azt. Előtte színszűrők (RGB) állítják elő a színeket.<\/p><\/li>\n<li><p><strong>Paneltípusok feszültségvezérlés szerint:<\/strong><\/p>\n<ul>\n<li><p>IPS (<strong>In-Plane Switching<\/strong> – felépítés: Párhuzamos polárszűrők, 2 FET): A feszültséget a cella oldalára (egyik oldalára) kapcsolják.<\/p><\/li>\n<li><p>VA (<strong>Vertical Alignment<\/strong> – felépítés: külön-külön forduló kristályok) és TN (<strong>Twisted Nematic<\/strong> – felépítés: 1 FET és 2 ÉS kapu, csavart kristályszerkezet): A feszültséget a cella ellentétes oldalaira (Két oldalról) kapcsolják<\/p><\/li>\n<li><p>A legfontosabb különbség a feszültség rákapcsolásának irányában és a kristályok viselkedésében van.<\/p><\/li>\n<\/ul><\/li>\n<li><p>Vezérlés: TFT (aktív mátrix, tranzisztoros) vagy DSTN (passzív mátrix)<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Plazma<\/strong><\/p>\n<ul>\n<li><p><strong>Alapelv:<\/strong> Neon és Xenon gázt használ, minden szubpixel egy kis gázcella, ami felvillan<\/p><\/li>\n<li><p><strong>Háttérvilágítás:<\/strong> Nem igényli, mert a pixelek maguk világítanak.<\/p><\/li>\n<li><p><strong>Összehasonlítás más kijelzőkkel:<\/strong> Kontrasztosabb és jobb a színhűsége, mint az LCD-nek, de nagyobb az áramfogyasztása.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>OLED (Organic Light-Emitting Diode)<\/strong><\/p>\n<ul>\n<li><p><strong>Alapelv:<\/strong> Szerves (organikus) molekulák bocsájtják ki a fényt.<\/p><\/li>\n<li><p><strong>Háttérvilágítás:<\/strong> Nem igényli, emiatt vékony és akár hajlékony is lehet.<\/p><\/li>\n<li><p><strong>Hátránya:<\/strong> A szerves anyag idővel „kifárad” (öregszik), így veszít a színhűségéből (sárgulhat a kép) és a fényerejéből<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Micro LED<\/strong><\/p>\n<ul>\n<li><p><strong>Alapelv:<\/strong> Mikroszkopikus méretű, önálló LED-ek alkotják a szubpixeleket.<\/p><\/li>\n<li><p><strong>Előnye:<\/strong> Az OLED-del szemben--» mivel nincs benne szerves anyag, ezért nem öregszik el olyan hamar. (Sony és Samsung technológia)<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>CRT (Katódcsöves monitor) –<\/strong> régi technológia<\/p>\n<ul>\n<li><p><strong>Alapelv:<\/strong> A képernyő belső felületén lévő foszforréteg 3 különálló elektronágyú (RGB) bombázza<\/p><\/li>\n<li><p><strong>Képalkotás:<\/strong> Pásztázással (Raster scan) rajzolja ki a képet, ami lehet Interlaced (váltott soros) vagy Non-interlaced, Progresszív (szebb képalkotás)<\/p><\/li>\n<li><p><strong>Tény:<\/strong> Passzív megjelenítő, mert a foszfor csak akkor villan fel, ha eltalálja a sugár. --» ezért fárasztja a szemet a vibrálás<\/p><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<li><p><strong>RAID<\/strong> (Redundant Array of Inexpensive Disks / Redundant Array of Independent Disks) szintek – a merevlemezek logikai egységekbe szervezését jelenti, aminek a fő célja az adatbiztonság és/vagy az adatátviteli sebesség növelése<\/p>\n<ul>\n<li><p><strong>RAID 0 (Összefűzés):<\/strong><\/p>\n<ul>\n<li><p><strong>Működési elv:<\/strong> A csatlakoztatott lemezeket összefűzi egyetlen logikai lemezzé<\/p><\/li>\n<li><p><strong>Sebesség:<\/strong> Mind az írási, mind az olvasási műveletek párhuzamosan történnek – mindkét sebesség növekszik<\/p><\/li>\n<li><p><strong>Adatbiztonság:<\/strong> Nincs redundancia, nincs hibatűrés. Egyetlen meghajtó meghibásodása az egész tömb (minden adat) elvesztését okozza<\/p><\/li>\n<li><p><strong>Kapacitás:<\/strong> Különböző kapacitású lemezek is összekapcsolhatók, de a nagyobb lemezeket is csak a legkisebb kapacitású lemez méretéig lehet használni.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>RAID 1 (Tükrözés):<\/strong><\/p>\n<ul>\n<li><p><strong>Működési elv:<\/strong> Az információkaat egyidejűleg tárolja a tömb minden elemén – tükrözi az adatokat<\/p><\/li>\n<li><p><strong>Sebesség:<\/strong> Az adatok olvasása párhuzamosan történik – gyorsul az olvasás, de az írás normál sebességgel megy végbe. (RAID1 gyorsabb adatélérést biztosít, mint a RAID5)<\/p><\/li>\n<li><p><strong>Adabiztonság:<\/strong> Igen jó hibavédelmet biztosít. A rendszer 1 lemez meghibásodását adatvesztés nélkül elviseli.<\/p><\/li>\n<li><p><strong>Kapacitás:<\/strong> A logikai lemez a tömb legkisebb elemével lesz egyenlő méretű<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>RAID 5 (Körbeforgó paritás):<\/strong><\/p>\n<ul>\n<li><p><strong>Működési elv:<\/strong> A hibajavításhoz szükséges paritásinformációkat nem egy dedikált meghajtón, hanem egyenletesen az összes meghajtón elosztva (körbeforgó paritással) tárolja.<\/p><\/li>\n<li><p><strong>Adatbiztonság:<\/strong> Maximum 1 lemez meghibásodását képes javítani (Kettő esetén az adatok elvesznek)<\/p><\/li>\n<li><p><strong>Hardverigény:<\/strong> Minimálisan 3db lemez<\/p><\/li>\n<li><p><strong>Kapacitás:<\/strong> Meghajtók száma-1 x legkisebb kapacitású meghajtó mérete<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>RAID 6 (Dupla paritás)<\/strong><\/p>\n<ul>\n<li><p><strong>Működési elv:<\/strong> A RAID 5 kiterjesztése, ahol nemcsak soronként, hanem oszloponként is kiszámítják a paritást (Kétszer annyi helyet foglal a paritás, mint RAID 5-nél)<\/p><\/li>\n<li><p><strong>Adatbiztonság:<\/strong> Maximum 2 lemez egyidejű kiesését képes elviselni.<\/p><\/li>\n<li><p><strong>Hardverigény:<\/strong> Minimális lemezszám: 4db<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Hibrid RAID szintek (RAID 01 és RAID 10)<\/strong><\/p>\n<ul>\n<li><p><strong>RAID 0+1 (RAID 01):<\/strong> Két (vagy több) összefűzött (RAID 0) tömböt tükröz (RAID 1). Hátránya: ha egy lemez meghibásodik, a RAID 0 szétesik, így a tükrözés is megszakad. Bár sebességnövelő, de lassabb a sima RAID 0-nál.<\/p><\/li>\n<li><p><strong>RAID 1+0 (RAID 10):<\/strong> Először tükrözi a lemezeket (RAID 1), majd a kapott tömböket fűzi össze (RAID 0). Biztonságosabb a RAID 01-nél, mert 1 diszk kiesése csak a saját tükrözött tömbjét érinti, a rá épült RAID 0-t nem.<\/p><\/li>\n<li><p><strong>Összehasonlítás<\/strong>: Sebesség szempontjából a RAID 01 és a RAID 10 között nincs különbség (mindkettőnél nő az olvasás és az írás is), de a RAID 10 biztonságosabb. Mindkettőhöz minimum 4 eszköz kell, és a kapacitás a felére csökken.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>További hibridek (RAID 50, RAID 60):<\/strong><\/p>\n<ul>\n<li><p><strong>RAID 5 tömbök összefűzése:<\/strong> RAID 50<\/p><\/li>\n<li><p><strong>RAID 6 tömbök összefűzése:<\/strong> RAID 60<\/p><\/li>\n<li><p>Mivel ezek több független tömbből állnak, a RAID 50 több mint 1, a RIAD 60 pedig több mint 2 lemez meghibásodását is elviselheti, de csak akkor, ha azok nem ugyanabban az alsóbb szintű tömbben vannak.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Dynamic Disk Pool (DDP)<\/strong><\/p>\n<ul>\n<li><p><strong>Probléma:<\/strong> A hagyományos RAID 6 és más paritásos RAID-ek esetében a nagy kapacitású lemezek (2-3TB) meghibásodása eseten a helyreállítás sok idő<\/p><\/li>\n<li><p><strong>Megoldás:<\/strong> A DDP ezt az időt tudja drasztikusan lerövidíteni. Használatához: elméleti 7-tel szemben, minimum 11 db HDD vagy SSD szükséges.<\/p><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<li><p><strong>Egy memória valós Órajele, FSB Sebessége és Sávszélessége:<\/strong><\/p>\n<ul>\n<li><p><strong>Pl.:<\/strong> DDR4-3000 PC4-24000<\/p>\n<ul>\n<li><p><strong>Valós órajel:<\/strong> 1500MHz<\/p><\/li>\n<li><p><strong>FSB (főoldali busz) sebesség:<\/strong> 3000MHz<\/p><\/li>\n<li><p><strong>Sávszélesség:<\/strong> 24000MB/s<\/p><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<li><p><strong>A memóriák felosztása és működési jellemzői:<\/strong><\/p>\n<ul>\n<li><p>A RAM (Random Access Memory) szóban a random kifejezés a tetszőlegest jelenti (szekvenciális ellentéte). A RAM-ok volatilis (múlékony) tárolók, azaz a tápfesz. kikapcsolásakor tartalmuk elvész.<\/p><\/li>\n<li><p><strong>SRAM (Statikus RAM):<\/strong><\/p>\n<ul>\n<li><p><strong>Felépítés:<\/strong> Logikai áramköröket tekintve egy cellája 2 egymással szembe kötött inverterből és 2 MOSFET-ből áll.<\/p><\/li>\n<li><p><strong>Működés:<\/strong> Mindaddig megőrzi a tárolt bit értékét, amíg tápfesszel ellátják, így frissítést nem igényel.<\/p><\/li>\n<li><p><strong>Jellemzők:<\/strong> A DRAM-nál lényegesen gyorsabb, de a gyártási technológia miatt drágább is.<\/p><\/li>\n<li><p><strong>Felhasználás:<\/strong> Elsődlegesen a processzorok gyorsítótárainál alkalmazzák<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>DRAM (Dinamikus RAM):<\/strong><\/p>\n<ul>\n<li><p><strong>Felépítés:<\/strong> Minden egyes cellája egy kondenzátort és egy tranzisztort (MOSFET-et) tartalmaz. AZ információt a kondenzátor töltöttségi szintje (0 vagy 1) tárolja<\/p><\/li>\n<li><p><strong>Működés:<\/strong> A kondenzátor csak nagyon rövid ideig képes megőrizni a töltését, ezért a tartalmat ciklikusan frissíteni kell (másodpercenként kb. egyszer). Egy cella írásakor a teljes sor kiolvasásra kerül, egy érték megváltozik majd az egész sor újra visszaíródik.<\/p><\/li>\n<li><p><strong>Jellemzők:<\/strong> A legáltalánosabban használt, a statikus RAM-nál jóval olcsóbb operatív tároló<\/p><\/li>\n<li><p><strong>SDR, DDR és ECC technológiák<\/strong><\/p>\n<ul>\n<li><p>SDR (Single Data Rate): Az órajel ciklusonként egyszeri adatátvitelre képes.<\/p><\/li>\n<li><p>DDR (Double Data Rate): Az órajel ciklusonként kétszeri adatátvitelt tesz lehetővé, a felfutó és lefutó él mentén egyaránt.<\/p><\/li>\n<li><p>ECC (Error-Correcting Code): Professzionális szerverekben használt memóriák, amelyek paritásgenerálás segítségével képesek a hibajavításra.<\/p><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<li><p><strong>Csak olvasható memóriák (ROM):<\/strong><\/p>\n<ul>\n<li><p>A ROM (Read Only Memory) stabil, nem volatilis tároló, így a benne tárolt adatok a feszültség kikapcsolásával sem vesznek el. Általában nem változó programok tárolására használják. (BIOS, BOOT programok)<\/p><\/li>\n<li><p>Főbb típusai:<\/p>\n<ul>\n<li><p>PROM: Programozható ROM<\/p><\/li>\n<li><p>EPROM: Törölhető és programozható ROM<\/p><\/li>\n<li><p>EEPROM: Elektromosan törölhető és programozható ROM<\/p><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<li><p><strong>Flash memóriák:<\/strong><\/p>\n<ul>\n<li><p>A Flash memória az EEPROM egy továbbfejlesztett változata, amely nemcsak teljes egészében, hanem blokkonként is törölhető, illetve újraírható. Energiaellátás nélkül is megőrzi az adatokat, nincsenek mozgó alkatrészei, az olvasási ideje pedig a HDD-nél gyorsabb, de a dinamikus RAM-nál lassabb.<\/p><\/li>\n<li><p><strong>Kategóriái:<\/strong><\/p>\n<ul>\n<li><p><strong>NOR technológia (pl.: Intel):<\/strong><\/p>\n<ul>\n<li><p>Párhuzamos adathozzáférést és közvetlen, bájtonkénti elérést biztosít (Random címzés)<\/p><\/li>\n<li><p>Közvetlen programfuttatásra alkalmas<strong>.<\/strong><\/p><\/li>\n<li><p>Kisebb kapacitású, de gyors olvasású, viszonylag drága technológia<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>NAND technológia (pl.: Samsung):<\/strong><\/p>\n<ul>\n<li><p>Soros adathozzáférésű, csak laponként címezhető, ezét közvetlen programfuttatásra nem alkalmas.<\/p><\/li>\n<li><p>Nagyobb adatmennyiség folytonos írásra-olvasásra való<\/p><\/li>\n<li><p>Fizikailag kisebb helyigényű, energiatakarékosabb, nagyobb kapacitású és olcsóbb, mint a NOR<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Cellák kapacitása (bit/cella, élettartam és ár összefüggés):<\/strong><\/p>\n<ul>\n<li><p><strong>SLC:<\/strong> 1 bit/cella. A legdrágább, de ez bírja a legtöbb írást (leghosszabb élettartam).<\/p><\/li>\n<li><p><strong>MLC:<\/strong> 2 bit/cella. Arany középút.<\/p><\/li>\n<li><p><strong>TLC:<\/strong> 3 bit/cella. A legolcsóbb, legnagyobb kapacitású, de a leggyorsabban „kifáradó” típus (otthoni SSD-k).<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>A cellák technológiája:<\/strong><\/p>\n<ul>\n<li><p><strong>FGT:<\/strong> Az első generáció, szilícium-dioxid szigetelőréteggel.<\/p><\/li>\n<li><p><strong>CTF:<\/strong> Kisebb méretű, szilícium-nitrid alapú szigetelés.<\/p><\/li>\n<li><p><strong>3D V-NAND:<\/strong> A CTF kis mérete miatt a cellákat már egymás fölé is tudják rétegezni.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Kifáradás és Wear Leveling (kiegyensúlyozás):<\/strong><\/p>\n<ul>\n<li><p>Az írások során a NAND cellák szigetelőrétege kopik.<\/p><\/li>\n<li><p><strong>Wear Leveling:<\/strong> A vezérlő a háttérben folyamatosan pakolássza az adatokat, hogy a cellák egyenletesen kopjanak.<\/p><\/li>\n<li><p>Emiatt érdemes a kiírt kapacitásból 10%-ot üresen hagyni, hogy a vezérlőnek legyen mozgástere a kiegyensúlyozáshoz.<\/p><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<li><p><strong>3LCD Projektorok<\/strong><\/p>\n<ul>\n<li><p><strong>Működési elv:<\/strong> A technológia a fény áteresztés – fény át nem eresztés <strong>elvén alapul<\/strong><\/p><\/li>\n<li><p><strong>Dikroikus szűrők:<\/strong> A projektorban található félig áteresztő tükrök precíziós optikai elemek, amelyek egy üveglapra felvitt, különböző törésmutatójú dielektromos rétegek sorozatából állnak.<\/p><\/li>\n<li><p><strong>Hőkezelés:<\/strong> A szűrő több vékonyrétegű bevonata segítségével a fény bizonyos hullámhosszait átereszti, míg a többit visszaveri. A hagyományos színszűrőkkel ellentétben nem nyeli el a nem kívánt fényt, hanem szelektíven irányítja azt, így nem melegszik túl.<\/p><\/li>\n<li><p><strong>Fényveszteség:<\/strong> Az LCD polarizációja miatt a fényerő egy része elvész (Kiszűrődik), így működéséhez erős fényforrásra van szükség.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>DLP (Digital Light Processing) Projektorok<\/strong><\/p>\n<ul>\n<li><p><strong>Működési elv:<\/strong> A teljes fénymennyiséget mikrotükrök verik vissza.<\/p><\/li>\n<li><p><strong>Fényerő:<\/strong> Nem szenved fényerőveszteséget az LCD-kre jellemző polarizáció miatt, így hatékonyabb a fényhasznosítása.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>LED Projektorok:<\/strong><\/p>\n<ul>\n<li><p><strong>Felépítés:<\/strong> Különálló kék, piros és zöld LED fényforrásokat használ<\/p><\/li>\n<li><p><strong>Képalkotás:<\/strong> A fényt optikai komponensek, lencsék és prizmák irányítják a DLP chipre (és a tükörre)<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Laser + DLP Hibrid Projektorok:<\/strong><\/p>\n<ul>\n<li><p><strong>Fényforrások:<\/strong> A technológia vegyesen alkalmazza a lézert és a LED-et. Jellemzően egy kék lézert és egy piros LED-et használ kondenzor lencsékkel kiegészítve.<\/p><\/li>\n<li><p><strong>Színkeverés:<\/strong> A Laser+DLP Hybrid technológia a zöld szín előállításához kék lézert használ<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Nyomtatók általános jellemzői:<\/strong><\/p>\n<ul>\n<li><p>A nyomtatók felbontását dpi-ben mérjük, ami eltér a képernyők ppi alapú méréstől<\/p><\/li>\n<li><p><strong>Mátrix nyomtatók:<\/strong><\/p>\n<ul>\n<li><p><strong>Technológia:<\/strong> Általában 24 tűs technológiát használnak. Az óravázlatban a Citizen gyártó megoldása van.<\/p><\/li>\n<li><p><strong>Tény:<\/strong> A mátrix nyomtatók legelőnyösebb tulajdonsága a több példány egyidejű nyomtatása<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Tintasugaras (Injekt) nyomtatók:<\/strong><\/p>\n<ul>\n<li><p>A tintasugaras nyomtatók forró tintacseppeket lövellnek a felületre. Az „INK Jet” technológia is használ hevítést (az ezt tagadó állítás HAMIS). A gyártókhoz köthető specifikus technológiák:<\/p>\n<ul>\n<li><p><strong>Bubble Jet (Canon):<\/strong> A tinta kilövellését buborékok segítségével végzi. A technológia a tintát közvetetten melegíti<\/p><\/li>\n<li><p><strong>Piezo (Epson):<\/strong> A piezoelektromos kristályok alakváltozását használja.<\/p><\/li>\n<li><p><strong>Ink Jet (HP):<\/strong> A HP által fejlesztett technológia<\/p><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<li><p><strong>Lézernyomtatók:<\/strong><\/p>\n<ul>\n<li><p>A lézernyomtatóknál két fő technológiát különböztetünk meg:<\/p><\/li>\n<li><p><strong>Szkenneres lézer (Lexmark, HP):<\/strong> Egy forgó tükör segítségével vetítik a lézert a hengerre. Ennél a technológiánál a fényforrásból származó fény közvetetten jut el a fényhengerre.<\/p><\/li>\n<li><p><strong>LED lézer (OKI):<\/strong> A lézert egy teljes szélességű LED sor helyettesíti. A LED lézer technológia esetén a lapméret növelése jelentős készülékméret növekedést eredményez.<\/p><\/li>\n<li><p><strong>A lézernyomtatás működési lépései:<\/strong><\/p>\n<ul>\n<li><p>A henger elektromos töltést kap<\/p><\/li>\n<li><p>A lézer megvilágítja a fényérzékeny hengert, amely elektromosan töltött marad ott, ahol a nyomtatandó pontok lesznek.<\/p><\/li>\n<li><p>A lézer áthalad a fekete port tartalmazó toneren és a festékszemcsék ráragadnak a töltött részekre<\/p><\/li>\n<li><p>Egy töltő vezeték feltölti a papírlapot, majd azt a henger felé továbbítja<\/p><\/li>\n<li><p>A festék a hengerről átkerül a papírra<\/p><\/li>\n<li><p>A papír áthalad a fűtőrendszeren, amely hő és nyomás segítségével ráégeti a festéket a lapra<\/p><\/li>\n<li><p>A „corona wire” elvezeti az elektromos töltést a hengerről, felkészítve azt a következő oldalra.<\/p><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<li><p><strong>ZINK (Zero Ink technológia):<\/strong><\/p>\n<ul>\n<li><p>A ZINK technológia nem igényel nyomtatófestéket. (A színeket egy speciális papírból hő hatására hívja elő)<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Egyéb nyomtatási technológiák<\/strong><\/p>\n<ul>\n<li><p><strong>3D nyomtatók<\/strong>: Ide tartoznak az Objet, Isis One és Carbon3D megoldások, melyek az FDM, SLA, SLS eljárásokat használják.<\/p><\/li>\n<li><p>További technológiák a termotranszfer (Canon hőátadásos), a termálviaszos és a festékszublimációs eljárások, míg az írógép és a margarétafejes nyomtatók elavultak.<\/p><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<li><p>Szkennerek és optikai bemeneti eszközök<\/p>\n<ul>\n<li><p><strong>Kategóriák:<\/strong> Síkágyas szkenner, lapolvasó, kézi olvasó, illetve a vonalkód- és QR-kód olvasók (pl. UPC-A kód).<\/p><\/li>\n<li><p><strong>Vonalkódolvasó:<\/strong> Olyan alkalmazásokban használják, ahol gyors, pontos és ismétlődő inputra van szükség, optikailag vonalakat olvas le.<\/p><\/li>\n<li><p><strong>A szkenner felépítése és működése:<\/strong> A fényforrásból (light source) származó fény visszaverődik az eredeti lapról. A fény tükrökön (mirror) és lencséken (lens) áthaladva egy RGB-bevonatú fényérzékelő CCD chipre (Charge-Coupled Device) jut. A fényérzékelő elemek által felfogott képet végül egy A/D konverter digitalizálja a számítógép számára.<\/p><\/li>\n<li><p><strong>OCR (Optikai Karakterfelismerő):<\/strong> A nyomtatott szöveget beolvassa és szöveges adattá konvertálja. Általános használata azonban korlátozott a viszonylag magas hibaarány miatt.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>LMC (Little Man Computer) - Az alapok:<\/strong><\/p>\n<ul>\n<li><p>Egy elméleti számítógép modell, amit a CPU és a memória működésének megértésére találtak ki - bemutatja a Neumann-architektúrát.<\/p><\/li>\n<li><p><strong>Fő komponensei (a kis ember munkaállomása)<\/strong><\/p>\n<ul>\n<li><p><strong>Postafiók (Memória):<\/strong> Összesen 100 db van belőle, 0-99ig címezve. A Neumann-elv miatt nagyon fontos: itt tárólódnak az adatok ÉS maguk a program utasításai is!<\/p><\/li>\n<li><p><strong>Számológép (Akkumulátor - ACC):<\/strong> Itt történnek a műveletek (összeadás, kivonás). Minden adatmozgatás a memóriából először ide kerül.<\/p><\/li>\n<li><p><strong>Programszámláló (Program Counter - PC):<\/strong> Egy kis kijelző, ami mindig a következő végrehajtandó utasítás címét (fiókszámát mutatja)<\/p><\/li>\n<li><p><strong>Utasítás Regiszter:<\/strong> Ide kerül be az éppen aktuális utasítás a fiókból, amit a kis emberkének végre kell hajtania<\/p><\/li>\n<li><p><strong>Bementei/Kimeneti Kosár(In Box/Out Box):<\/strong> Itt tudunk adatot beadni, és itt esik ki a végeredmény<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Utasítások és gépi kód:<\/strong><\/p>\n<ul>\n<li><p>Minden gépi kódú utasítás pontosan 3 számjegyből áll.<\/p><\/li>\n<li><p>Az első számjegy maga a parancs (műveleti kód/Opcode), a maradék kettő pedig a memóriacím (Operandus – azaz melyik fiókkal dolgozunk)<\/p><\/li>\n<li><p>A legfontosabb parancsok(Assembly-»gépi kód):<\/p>\n<ul>\n<li><p>INP (901): Bekéri az adatot a bemeneti kosárból az akkumulátorba.<\/p><\/li>\n<li><p>OUT (902): Kipakolja az akkumulátor tartalmát a kimeneti kosárba.<\/p><\/li>\n<li><p>LDA (5xx): Betölti a megadott (xx) fiók tartalmát az akkumulátorba (Load).<\/p><\/li>\n<li><p>STA (3xx): Kimenti az akkumulátor tartalmát a megadott (xx) fiókba (Store).<\/p><\/li>\n<li><p>ADD (1xx) / SUB (2xx): Összead / Kivon.<\/p><\/li>\n<li><p>Ugrások: BRA (6xx - feltétel nélküli ugrás), BRZ (7xx - ugrik, ha az akku értéke 0), BRP (8xx - ugrik, ha az akku pozitív).<\/p><\/li>\n<li><p>HLT (000): Program vége (megáll).<\/p><\/li>\n<li><p>DAT: Adattárolás (ez nem egy végrehajtható utasítás, csak lefoglal egy fiókot a memóriában egy változónak).<\/p><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<\/ul><\/li>\n<\/ul>\n";

", "Kriptont és neont"], "c": 0, "e": "Az összefoglaló szerint neont és xenont; minden szubpixel egy kis gázcella."}, {"id": "m9", "t": "Kijelzők", "q": "Melyik igaz a plazmára az LCD-hez képest?", "o": ["Kontrasztosabb, de nagyobb az áramfogyasztása", "Kisebb fogyasztású, de kevésbé kontrasztos", "Háttérvilágítást igényel", "Szerves anyaga idővel kifárad"], "c": 0, "e": "A plazma kontrasztosabb, jobb a színhűsége, cserébe többet fogyaszt. A kifáradó szerves anyag az OLED-é."}, {"id": "m10", "t": "Kijelzők", "q": "Mi az OLED fő hátránya?", "o": ["A szerves anyag idővel kifárad, sárgulhat a kép", "Háttérvilágítást igényel", "Vibrál, fárasztja a szemet", "Nem lehet hajlékony"], "c": 0, "e": "Az OLED szerves anyaga öregszik, veszít színhűségéből és fényerejéből. Háttérvilágítás nélkül vékony, akár hajlékony is lehet."}, {"id": "m11", "t": "Kijelzők", "q": "Miért öregszik lassabban a Micro LED, mint az OLED?", "o": ["Nincs benne szerves anyag", "Háttérvilágítást használ", "Gázcellákból áll", "Kevesebb pixele van"], "c": 0, "e": "A Micro LED szubpixelei önálló mikroszkopikus LED-ek, szerves anyag nélkül."}, {"id": "m12", "t": "Kijelzők", "q": "Melyik cégek technológiája a Micro LED az összefoglaló szerint?", "o": ["Sony és Samsung", "Canon és Epson", "Intel és Samsung", "HP és OKI"], "c": 0, "e": "Az összefoglaló a Sonyt és a Samsungot nevezi meg."}, {"id": "m13", "t": "Kijelzők", "q": "Hány elektronágyú van a színes CRT-ben?", "o": ["3", "1", "2", "4"], "c": 0, "e": "Egy-egy az R, G és B színhez."}, {"id": "m14", "t": "Kijelzők", "q": "Melyik képrajzolási mód adja a CRT-n a szebb képet?", "o": ["Non-interlaced (progresszív)", "Interlaced (váltott soros)", "DSTN", "TFT"], "c": 0, "e": "A progresszív minden képben minden sort kirajzol."}, {"id": "m15", "t": "Kijelzők", "q": "Miért fárasztja a szemet a CRT?", "o": ["A foszfor csak akkor villan fel, ha eltalálja a sugár – vibrál", "Túl erős a háttérvilágítás", "A szerves anyag sárgul", "A polárszűrő elnyeli a fényt"], "c": 0, "e": "Passzív megjelenítő: a pont a sugár elhaladása után elhalványul, ettől vibrál a kép."}, {"id": "m16", "t": "RAID", "q": "Mi a RAID 0 működési elve?", "o": ["Összefűzés", "Tükrözés", "Körbeforgó paritás", "Dupla paritás"], "c": 0, "e": "RAID 0 = összefűzés, RAID 1 = tükrözés, RAID 5 = körbeforgó paritás, RAID 6 = dupla paritás."}, {"id": "m17", "t": "RAID", "q": "Hány lemez meghibásodását tűri a RAID 0?", "o": ["0", "1", "2", "A lemezek felét"], "c": 0, "e": "Nincs redundancia: egy lemez hibája az összes adat elvesztését okozza."}, {"id": "m18", "t": "RAID", "q": "Mi gyorsul RAID 1 esetén?", "o": ["Csak az olvasás", "Csak az írás", "Az írás és az olvasás is", "Egyik sem"], "c": 0, "e": "Olvasni párhuzamosan lehet a tükrökről, írni viszont mindegyikre ugyanazt kell."}, {"id": "m19", "t": "RAID", "q": "Mekkora a RAID 1 tömb kapacitása?", "o": ["A tömb legkisebb elemével egyenlő", "A lemezek összege", "(n − 1) × legkisebb lemez", "A lemezek összegének fele"], "c": 0, "e": "Tükrözés: minden lemezen ugyanaz van, így a hasznos méret a legkisebb lemezé."}, {"id": "m20", "t": "RAID", "q": "Mekkora a RAID 5 hasznos kapacitása?", "o": ["(meghajtók száma − 1) × legkisebb meghajtó", "Meghajtók száma × legkisebb meghajtó", "A legkisebb meghajtó mérete", "A teljes kapacitás fele"], "c": 0, "e": "Egy lemeznyi hely (elosztva) a paritásé."}, {"id": "m21", "t": "RAID", "q": "Hol tárolja a paritást a RAID 5?", "o": ["Egyenletesen elosztva az összes meghajtón", "Egy dedikált paritásmeghajtón", "Két dedikált meghajtón", "Sehol, nincs paritása"], "c": 0, "e": "Ezért „körbeforgó” paritás."}, {"id": "m22", "t": "RAID", "q": "Minimum hány lemez kell a RAID 5-höz?", "o": ["3", "2", "4", "11"], "c": 0, "e": "RAID 5: min. 3, RAID 6: min. 4, DDP: min. 11."}, {"id": "m23", "t": "RAID", "q": "Hány lemez egyidejű kiesését viseli el a RAID 6?", "o": ["2", "1", "3", "0"], "c": 0, "e": "Soronként és oszloponként is számol paritást, ezért két lemez esetén is visszaállítható."}, {"id": "m24", "
